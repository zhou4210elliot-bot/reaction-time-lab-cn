.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;rt-lab-cn-v2&quot;&gt;

    #rt-lab-cn-v2 .rt-dir-up { grid-area: up; }
    #rt-lab-cn-v2 .rt-dir-left { grid-area: left; }
    #rt-lab-cn-v2 .rt-dir-down { grid-area: down; }
    #rt-lab-cn-v2 .rt-dir-right { grid-area: right; }

    #rt-lab-cn-v2 .rt-key {
      color: var(--muted-foreground);
      white-space: nowrap;
    }

    #rt-lab-cn-v2 .rt-results-grid {
      display: grid;
      gap: 1rem;
    }

    #rt-lab-cn-v2 .rt-bars {
      display: grid;
      gap: 0.85rem;
    }

    #rt-lab-cn-v2 .rt-bar-row {
      display: grid;
      grid-template-columns: minmax(7rem, 10rem) 1fr minmax(4.5rem, auto);
      gap: 0.75rem;
      align-items: center;
    }

    #rt-lab-cn-v2 .rt-bar-track {
      height: 1rem;
      border-radius: 999px;
      background: var(--muted);
      overflow: hidden;
    }

    #rt-lab-cn-v2 .rt-bar-fill {
      display: block;
      height: 100%;
      min-width: 0.2rem;
      border-radius: inherit;
      background: var(--viz-series-1);

    #rt-lab-cn-v2 .rt-bar-row:nth-child(2) .rt-bar-fill {
      background: var(--viz-series-2);
    }

    #rt-lab-cn-v2 .rt-equation {

      gap: 0.5rem;

      }

      #rt-lab-cn-v2 .rt-bar-track {

      }
    }

    @media (prefers-reduced-motion: reduce) {
      #rt-lab-cn-v2 .rt-stimulus {
        transition: none;
      }
    }

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;rt-lab-cn-v2&#x27;);
      if (!root || root.dataset.ready === &#x27;true&#x27;) return;
      root.dataset.ready = &#x27;true&#x27;;

      const PRACTICE_TRIALS = 3;
      const FORMAL_TRIALS = 10;
      const RESPONSE_LIMIT = 1800;
      const phases = [
        {
          id: &#x27;simple&#x27;,
          title: &#x27;第一阶段：简单反应&#x27;,
          instruction: &#x27;圆点变为绿色并出现“点”字后，立即点击“立即反应”。不要提前点击。&#x27;,
          responses: [&#x27;simple&#x27;],
          keys: { &#x27; &#x27;: &#x27;simple&#x27; }
        },
        {
          id: &#x27;two&#x27;,
          title: &#x27;第二阶段：二选反应&#x27;,
          instruction: &#x27;看到圆形请选择“圆形”，看到三角形请选择“三角形”。电脑可按 F 或 J。&#x27;,
          responses: [&#x27;circle&#x27;, &#x27;triangle&#x27;],
          keys: { f: &#x27;circle&#x27;, j: &#x27;triangle&#x27; }
        },
        {
          id: &#x27;four&#x27;,
          title: &#x27;第三阶段：四选反应&#x27;,
          instruction: &#x27;辨认箭头方向，并点击对应方向按钮。电脑可直接按方向键。&#x27;,
          responses: [&#x27;up&#x27;, &#x27;down&#x27;, &#x27;left&#x27;, &#x27;right&#x27;],
          keys: { ArrowUp: &#x27;up&#x27;, ArrowDown: &#x27;down&#x27;, ArrowLeft: &#x27;left&#x27;, ArrowRight: &#x27;right&#x27; }
        }
      ];

      const screens = {
        intro: root.querySelector(&#x27;[data-screen=&quot;intro&quot;]&#x27;),
        phase: root.querySelector(&#x27;[data-screen=&quot;phase&quot;]&#x27;),
        results: root.querySelector(&#x27;[data-screen=&quot;results&quot;]&#x27;)
      };
      const progress = [...root.querySelectorAll(&#x27;[data-progress]&#x27;)];
      const stimulus = root.querySelector(&#x27;[data-stimulus]&#x27;);
      const status = root.querySelector(&#x27;[data-status]&#x27;);
      const beginPhaseButton = root.querySelector(&#x27;[data-action=&quot;begin-phase&quot;]&#x27;);
      const phaseTitle = root.querySelector(&#x27;[data-phase-title]&#x27;);
      const phaseInstruction = root.querySelector(&#x27;[data-phase-instruction]&#x27;);
      const trialProgress = root.querySelector(&#x27;[data-trial-progress]&#x27;);
      const responseGroups = {
        simple: root.querySelector(&#x27;[data-response-simple]&#x27;),
        two: root.querySelector(&#x27;[data-response-two]&#x27;),
        four: root.querySelector(&#x27;[data-response-four]&#x27;)
      };
      const stageLabels = [...root.querySelectorAll(&#x27;[data-stage-label]&#x27;)];

      let state = createState();
      let waitTimer = null;
      let responseTimer = null;

      function createState() {
        return {
          phaseIndex: 0,
          practiceIndex: 0,
          formalIndex: 0,
          mode: &#x27;idle&#x27;,
          waiting: false,
          active: false,
          stimulusOnset: 0,
          correctResponse: null,
          results: {
            simple: { times: [], correct: 0, total: 0, misses: 0 },
            two: { times: [], correct: 0, total: 0, misses: 0 },
            four: { times: [], correct: 0, total: 0, misses: 0 }
          }
        };
      }

      function clearTimers() {
        window.clearTimeout(waitTimer);
        window.clearTimeout(responseTimer);
        waitTimer = null;
        responseTimer = null;
      }

      function showScreen(name) {
        Object.entries(screens).forEach(([key, screen]) =&gt; {
          screen.classList.toggle(&#x27;is-active&#x27;, key === name);
        });
      }

      function setProgress(index) {
        progress.forEach((step, i) =&gt; {
          step.classList.toggle(&#x27;is-current&#x27;, i === index);
          step.classList.toggle(&#x27;is-done&#x27;, i &lt; index);
        });
      }

      function setStatus(message, kind = &#x27;&#x27;) {
        status.textContent = message;
        status.classList.toggle(&#x27;is-good&#x27;, kind === &#x27;good&#x27;);
        status.classList.toggle(&#x27;is-error&#x27;, kind === &#x27;error&#x27;);
      }

      function setActiveStage(name) {
        const order = [&#x27;input&#x27;, &#x27;identify&#x27;, &#x27;select&#x27;, &#x27;output&#x27;, &#x27;feedback&#x27;];
        const index = order.indexOf(name);
        stageLabels.forEach((label, i) =&gt; {
          label.classList.toggle(&#x27;is-active&#x27;, i === index);
        });
      }

      function resetStimulus() {
        stimulus.className = &#x27;rt-stimulus&#x27;;
        stimulus.textContent = &#x27;·&#x27;;
        stimulus.setAttribute(&#x27;aria-label&#x27;, &#x27;等待刺激&#x27;);
      }

      function updateTrialProgress() {
        if (state.mode === &#x27;practice&#x27;) {
          trialProgress.textContent = `练习 ${state.practiceIndex + 1}/${PRACTICE_TRIALS}`;
        } else {
          trialProgress.textContent = `正式 ${state.formalIndex + 1}/${FORMAL_TRIALS}`;
        }
      }

      function preparePhase() {
        clearTimers();
        const phase = phases[state.phaseIndex];
        showScreen(&#x27;phase&#x27;);
        setProgress(state.phaseIndex + 1);
        phaseTitle.textContent = phase.title;
        phaseInstruction.textContent = phase.instruction;
        Object.entries(responseGroups).forEach(([key, group]) =&gt; {
          group.hidden = key !== phase.id;
        });
        state.mode = &#x27;idle&#x27;;
        state.practiceIndex = 0;
        state.formalIndex = 0;
        state.waiting = false;
        state.active = false;
        resetStimulus();
        setActiveStage(&#x27;&#x27;);
        setStatus(&#x27;准备后请点击“开始本阶段”&#x27;);
        beginPhaseButton.hidden = false;
        trialProgress.textContent = &#x27;尚未开始&#x27;;
      }

      function beginPhase() {
        beginPhaseButton.hidden = true;
        state.mode = &#x27;practice&#x27;;
        state.practiceIndex = 0;
        state.formalIndex = 0;
        startTrial();
      }

      function startTrial() {
        clearTimers();
        state.waiting = true;
        state.active = false;
        state.correctResponse = null;
        resetStimulus();
        updateTrialProgress();
        setActiveStage(&#x27;&#x27;);
        setStatus(&#x27;请等待刺激出现……&#x27;);
        const delay = 900 + Math.random() * 1500;
        waitTimer = window.setTimeout(showStimulus, delay);
      }

      function showStimulus() {
        state.waiting = false;
        state.active = true;
        const phase = phases[state.phaseIndex];
        const choice = phase.responses[Math.floor(Math.random() * phase.responses.length)];
        state.correctResponse = choice;

        if (phase.id === &#x27;simple&#x27;) {
          stimulus.textContent = &#x27;点&#x27;;
          stimulus.classList.add(&#x27;is-ready&#x27;);
          stimulus.setAttribute(&#x27;aria-label&#x27;, &#x27;绿色反应刺激已出现&#x27;);
        } else if (phase.id === &#x27;two&#x27;) {
          if (choice === &#x27;circle&#x27;) {
            stimulus.textContent = &#x27;●&#x27;;
            stimulus.classList.add(&#x27;is-circle&#x27;);
            stimulus.setAttribute(&#x27;aria-label&#x27;, &#x27;圆形刺激&#x27;);
          } else {
            stimulus.textContent = &#x27;▲&#x27;;
            stimulus.classList.add(&#x27;is-triangle&#x27;);
            stimulus.setAttribute(&#x27;aria-label&#x27;, &#x27;三角形刺激&#x27;);
          }
        } else {
          const arrows = { up: &#x27;↑&#x27;, down: &#x27;↓&#x27;, left: &#x27;←&#x27;, right: &#x27;→&#x27; };
          stimulus.textContent = arrows[choice];
          stimulus.classList.add(&#x27;is-arrow&#x27;);
          stimulus.setAttribute(&#x27;aria-label&#x27;, `${arrows[choice]}方向刺激`);
        }

        setActiveStage(&#x27;input&#x27;);
        setStatus(&#x27;刺激已出现，请立即反应！&#x27;, &#x27;good&#x27;);
        state.stimulusOnset = performance.now();
        responseTimer = window.setTimeout(handleMiss, RESPONSE_LIMIT);
      }

      function handleResponse(response) {
        if (screens.phase.classList.contains(&#x27;is-active&#x27;) === false || state.mode === &#x27;idle&#x27;) return;

        if (state.waiting) {
          clearTimers();
          state.waiting = false;
          setStatus(&#x27;反应过早，本次不计入次数。请等待刺激出现。&#x27;, &#x27;error&#x27;);
          resetStimulus();
          window.setTimeout(startTrial, 900);
          return;
        }

        if (!state.active) return;
        clearTimers();
        state.active = false;
        const rt = Math.round(performance.now() - state.stimulusOnset);
        const correct = response === state.correctResponse;
        const phase = phases[state.phaseIndex];

        setActiveStage(correct ? &#x27;output&#x27; : &#x27;select&#x27;);
        if (state.mode === &#x27;formal&#x27;) {
          const bucket = state.results[phase.id];
          bucket.total += 1;
          if (correct) {
            bucket.correct += 1;
            bucket.times.push(rt);
          }
        }

        if (correct) {
          setStatus(`正确，反应时间 ${rt} 毫秒`, &#x27;good&#x27;);
        } else {
          setStatus(&#x27;选择错误，本次记录为错误反应。&#x27;, &#x27;error&#x27;);
        }

        window.setTimeout(() =&gt; {
          setActiveStage(&#x27;feedback&#x27;);
          advanceTrial();
        }, 650);
      }

      function handleMiss() {
        if (!state.active) return;
        state.active = false;
        const phase = phases[state.phaseIndex];
        if (state.mode === &#x27;formal&#x27;) {
          const bucket = state.results[phase.id];
          bucket.total += 1;
          bucket.misses += 1;
        }
        setActiveStage(&#x27;feedback&#x27;);
        setStatus(&#x27;反应超时，本次记录为未反应。&#x27;, &#x27;error&#x27;);
        window.setTimeout(advanceTrial, 750);
      }

      function advanceTrial() {
        if (state.mode === &#x27;practice&#x27;) {
          state.practiceIndex += 1;
          if (state.practiceIndex &gt;= PRACTICE_TRIALS) {
            state.mode = &#x27;formal&#x27;;
            state.formalIndex = 0;
            setStatus(&#x27;练习完成，正式测试即将开始。&#x27;, &#x27;good&#x27;);
            resetStimulus();
            window.setTimeout(startTrial, 1100);
          } else {
            startTrial();
          }
          return;
        }

        state.formalIndex += 1;
        if (state.formalIndex &gt;= FORMAL_TRIALS) {
          state.phaseIndex += 1;
          if (state.phaseIndex &gt;= phases.length) {
            showResults();
          } else {
            preparePhase();
          }
        } else {
          startTrial();
        }
      }

      function median(values) {
        if (!values.length) return null;
        const sorted = [...values].sort((a, b) =&gt; a - b);
        const mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[mid] : Math.round((sorted[mid - 1] + sorted[mid]) / 2);
      }

      function accuracy(bucket) {
        return bucket.total ? Math.round((bucket.correct / bucket.total) * 100) : 0;
      }

      function formatMs(value) {
        return value === null ? &#x27;有效数据不足&#x27; : `${value} 毫秒`;
      }

      function showResults() {
        clearTimers();
        showScreen(&#x27;results&#x27;);
        setProgress(4);
        const values = {
          simple: median(state.results.simple.times),
          two: median(state.results.two.times),
          four: median(state.results.four.times)
        };

        root.querySelector(&#x27;[data-result-simple]&#x27;).textContent = formatMs(values.simple);
        root.querySelector(&#x27;[data-result-two]&#x27;).textContent = formatMs(values.two);
        root.querySelector(&#x27;[data-result-four]&#x27;).textContent = formatMs(values.four);
        root.querySelector(&#x27;[data-accuracy-simple]&#x27;).textContent = `正确率 ${accuracy(state.results.simple)}%`;
        root.querySelector(&#x27;[data-accuracy-two]&#x27;).textContent = `正确率 ${accuracy(state.results.two)}%`;
        root.querySelector(&#x27;[data-accuracy-four]&#x27;).textContent = `正确率 ${accuracy(state.results.four)}%`;

        const valid = Object.values(values).filter(value =&gt; value !== null);
        const maximum = valid.length ? Math.max(...valid, 1) : 1;
        Object.entries(values).forEach(([key, value]) =&gt; {
          root.querySelector(`[data-bar=&quot;${key}&quot;]`).style.width = value === null ? &#x27;0%&#x27; : `${Math.max(4, (value / maximum) * 100)}%`;
          root.querySelector(`[data-bar-value=&quot;${key}&quot;]`).textContent = formatMs(value);
        });

        const costTwo = values.simple !== null &amp;&amp; values.two !== null ? values.two - values.simple : null;
        const costFour = values.simple !== null &amp;&amp; values.four !== null ? values.four - values.simple : null;
        root.querySelector(&#x27;[data-cost-two]&#x27;).textContent = costTwo === null ? &#x27;有效数据不足&#x27; : `${costTwo &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${costTwo} 毫秒`;
        root.querySelector(&#x27;[data-cost-four]&#x27;).textContent = costFour === null ? &#x27;有效数据不足&#x27; : `${costFour &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${costFour} 毫秒`;

        let conclusion = &#x27;有效数据不足，请重新测试并尽量减少错误。&#x27;;
        if (costTwo !== null &amp;&amp; costFour !== null) {
          if (costTwo &gt; 0 &amp;&amp; costFour &gt;= costTwo) {
            conclusion = &#x27;你的结果呈现了典型趋势：可选反应越多，刺激辨认与反应选择所需的时间通常越长。&#x27;;
          } else {
            conclusion = &#x27;你的结果没有呈现稳定递增趋势。练习、预期、偶然波动和设备延迟都可能影响一次短测的结果。&#x27;;
          }
        }
        root.querySelector(&#x27;[data-conclusion]&#x27;).textContent = conclusion;
        root.querySelector(&#x27;[data-chart]&#x27;).setAttribute(
          &#x27;aria-label&#x27;,
          `简单反应${formatMs(values.simple)}，二选反应${formatMs(values.two)}，四选反应${formatMs(values.four)}`
        );
      }

      function restart() {
        clearTimers();
        state = createState();
        showScreen(&#x27;intro&#x27;);
        setProgress(0);
        resetStimulus();
      }

      root.addEventListener(&#x27;click&#x27;, event =&gt; {
        const action = event.target.closest(&#x27;[data-action]&#x27;)?.dataset.action;
        if (action === &#x27;start&#x27;) {
          state = createState();
          preparePhase();
          return;
        }
        if (action === &#x27;begin-phase&#x27;) {
          beginPhase();
          return;
        }
        if (action === &#x27;restart&#x27;) {
          restart();
          return;
        }
        const response = event.target.closest(&#x27;[data-response]&#x27;)?.dataset.response;
        if (response) handleResponse(response);
      });

      window.addEventListener(&#x27;keydown&#x27;, event =&gt; {
        if (!screens.phase.classList.contains(&#x27;is-active&#x27;)) return;
        const phase = phases[state.phaseIndex];
        if (!phase) return;
        const key = event.key === &#x27; &#x27; ? &#x27; &#x27; : event.key;
        const response = phase.keys[key] || phase.keys[key.toLowerCase?.()];
        if (response) {
          event.preventDefault();
          handleResponse(response);
        }
      });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
